services:
  - type: web
    name: tool-check-tkb-webhook
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: PORT
        value: 8000
      - key: STUDENT_ID
        sync: true
      - key: PASSWORD
        sync: true
      - key: TELEGRAM_BOT_TOKEN
        sync: true
      - key: TELEGRAM_CHAT_ID
        sync: true
      - key: TELEGRAM_WEBHOOK_URL
        sync: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: true
      - key: GOOGLE_CALENDAR_ID
        sync: true
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: true
